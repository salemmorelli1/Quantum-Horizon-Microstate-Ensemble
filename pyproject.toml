[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-horizon-microstate-ensemble"
version = "0.1.0"
description = "Differentiable LQG-inspired microstate area ensembles and scalable PyTorch HMC"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Salem Morelli"},
]
keywords = [
  "Hamiltonian Monte Carlo",
  "loop quantum gravity",
  "microstate ensembles",
  "PyTorch",
  "quantum black holes",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.0",
  "ruff>=0.6",
]
mcmc = [
  "pyro-ppl>=1.9",
]

[project.scripts]
qhme = "quantum_horizon_ensemble.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantum_horizon_ensemble = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
